name: Phase 1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock pip-audit
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - run: python -m pytest -q
      - run: pip-audit -r requirements.lock
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: disposable-ci-database-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p phase1-ci -f deployment/compose/compose.yml up --build -d --wait
      - run: curl --fail http://localhost:8080/api/v1/health/ready
      - run: docker compose -p phase1-ci -f deployment/compose/compose.yml exec -T api python -m app.cli seed-demo
      - run: docker cp apps/api/tests/compose_smoke.py phase1-ci-api-1:/tmp/compose_smoke.py
      - run: docker compose -p phase1-ci -f deployment/compose/compose.yml exec -T -e PYTHONPATH=/app api python /tmp/compose_smoke.py
      - if: always()
        run: docker compose -p phase1-ci -f deployment/compose/compose.yml down -v
