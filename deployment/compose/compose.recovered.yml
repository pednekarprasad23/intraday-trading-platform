# Overlay to mount recovered original volumes
# Use with: docker compose -f compose.yml -f compose.recovered.yml up

services:
  db:
    volumes:
      - intraday_postgres_data:/var/lib/postgresql/data
  redis:
    volumes:
      - intraday_redis_data:/data
  api:
    volumes:
      - intraday_historical_data:/var/lib/intraday/historical
      - intraday_credential_key:/var/lib/intraday/credentials

volumes:
  intraday_postgres_data:
    external: true
  intraday_redis_data:
    external: true
  intraday_historical_data:
    external: true
  intraday_credential_key:
    external: true