services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      private:
        aliases:
          - db
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      private:
        aliases:
          - redis
  api:
    build: ../../apps/api
    image: intraday-api:local
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trading}
      REDIS_URL: redis://redis:6379/0
      HISTORICAL_DATA_ROOT: /var/lib/intraday/historical
      CREDENTIAL_KEY_PATH: /var/lib/intraday/credentials/key
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    volumes:
      - historical_data:/var/lib/intraday/historical
      - credential_key:/var/lib/intraday/credentials
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [private]
  web:
    build: ../../apps/web
    image: intraday-web:local
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api: {condition: service_healthy}
    networks: [private]
volumes:
  postgres_data:
  redis_data:
  historical_data:
  credential_key:
  backup_data:
networks:
  private: